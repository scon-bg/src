name: PL/SQL PMD Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  pmd-scan:
    name: Run PMD Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run PMD CLI
        run: |
          PMD_VERSION="7.0.0"
          # Коригиран линк според официалния източник на PMD в GitHub
          wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip
          unzip pmd-dist-${PMD_VERSION}-bin.zip
          
          mkdir -p pmd-report
          
          # Коригирано име на распакованата папка (pmd-dist-7.0.0-bin) и насочено към вашата папка src
          ./pmd-dist-${PMD_VERSION}-bin/bin/pmd check \
            --dir="src" \
            --format=html \
            --report-file=pmd-report/pmd-results.html \
            --rulesets=category/plsql/bestpractices.xml,category/plsql/codestyle.xml
        continue-on-error: true

      - name: Upload PMD Report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-security-report
          path: pmd-report/pmd-results.html
