name: "CodeQL Java"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * 0' # Пуска се и автоматично всяка седмица

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Инициализиране на CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # 2. Алтернатива на Maven/Gradle: Използване на CodeQL autobuild или ръчно компилиране през javac
      - name: Autobuild / Manual Compile
        run: |
          # Ако нямате готов pom.xml или build.gradle, компилираме директно сорсовете от src папка
          if [ -d "src" ]; then
            echo "Компилиране на Java файловете от src папка..."
            find src -name "*.java" > sources.txt
            if [ -s sources.txt ]; then
              mkdir -p out
              javac -d out @sources.txt
            else
              echo "Няма намерени .java файлове в src."
            fi
          else
            # Автоматичен опит за билд от GitHub
            echo "Стартиране на autobuild..."
          fi
        continue-on-error: true

      # 3. Изпълнение на анализа
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3