<?xml version="1.0"?>
<ruleset name="PL/SQL Custom Rules"
         xmlns="http://pmd.sourceforge.net/ruleset/2.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://pmd.sourceforge.net/ruleset/2.0.0 https://pmd.sourceforge.io/ruleset_2_0_0.xsd">

    <description>
        Ruleset за статичен анализ на PL/SQL сорсове (пакети, процедури, функции, тригери).
    </description>

    <!-- Best practices: напр. WHEN OTHERS THEN NULL хваща и скрива грешки -->
    <rule ref="category/plsql/bestpractices.xml"/>

    <!-- Code style: форматиране, tab символи, дължина на редове, именуване -->
    <rule ref="category/plsql/codestyle.xml">
        <!-- Примерно изключване на прекалено строго правило за дължина на реда -->
        <exclude name="LineLength"/>
    </rule>

    <!-- Design: сложност, дълбочина на влагане и т.н. -->
    <rule ref="category/plsql/design.xml"/>

    <!-- Error prone: конструкции, склонни към грешки по време на изпълнение -->
    <rule ref="category/plsql/errorprone.xml"/>

</ruleset>